[theme]
base = "dark"
primaryColor = "#E8935A"
backgroundColor = "#0F1319"
secondaryBackgroundColor = "#171D26"
textColor = "#E7ECF2"
borderColor = "#2A3341"
linkColor = "#5EEAD4"
codeTextColor = "#5EEAD4"
codeBackgroundColor = "#131A22"
font = "Inter, -apple-system, sans-serif"
headingFont = "'Space Grotesk', Inter, sans-serif"
codeFont = "'JetBrains Mono', monospace"
baseRadius = "small"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = true

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false